[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-trace"
version = "0.1.0"
description = "Professional observability for your AI agent. Trace every tool call locally."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cyclopts>=4",
    "rich>=15",
]

[project.scripts]
ghost-trace = "ghost_trace.cli:app"
